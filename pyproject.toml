[project]
name = "prwatch"
version = "0.1.0"
description = "Terminal dashboard for open pull requests across a set of GitHub repositories"
requires-python = ">=3.9"
dependencies = [
    "textual>=1.0",
    "httpx>=0.27",
    # tomllib entered the stdlib in 3.11; tomli is the same parser, backported.
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
prwatch = "prwatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prwatch"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Textual's BINDINGS/CSS_PATH class attributes are mutable by design.
ignore = ["RUF012"]
