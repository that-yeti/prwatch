[project]
name = "prwatch"
version = "0.1.0"
description = "Terminal dashboard for open pull requests across a set of GitHub repositories"
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0",
    "httpx>=0.27",
]

[project.scripts]
prwatch = "prwatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prwatch"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Textual's BINDINGS/CSS_PATH class attributes are mutable by design.
ignore = ["RUF012"]
